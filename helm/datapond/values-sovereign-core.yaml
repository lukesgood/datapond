# helm/datapond/values-sovereign-core.yaml
# Sovereign Core — the on-prem twin of values-foundation.yaml.
#
# Portable Core (backend, frontend, PostgreSQL/pgvector, LiteLLM, Valkey) plus in-cluster
# MinIO for objects and Ollama for a local embedding + chat model. No catalog, no query
# engine, no OSS add-on: Sources/Catalog/Analytics stay hidden. No prompt, document text
# or embedding is sent to an external model provider: ai.egressPolicy: local-only is
# enforced at the gateway and fails closed (backend/app/api/ai_vectors.py:152-168). It is
# not a network egress control — the NetworkPolicy allows outbound traffic (see
# templates/networkpolicy.yaml), and first boot pulls container images and ~6 GB of
# Ollama models from the internet unless you mirror them. Everything here is inside the
# supported scope named in SUPPORT.md; values-onprem.yaml remains the extended community
# stack.
#
# Install:
#   helm upgrade --install datapond helm/datapond -n datapond --create-namespace \
#     -f helm/datapond/values-sovereign-core.yaml
#
# Embedding dimension: ai.embedDim MUST equal the embedding model's output. bge-m3 is
# 1024-d and matches ai_chunks vector(1024). Choosing a different model later is a new
# deployment or a full re-embed, never a version bump.

product:
  profile:
    id: sovereign-core
    label: Sovereign Core
    description: Self-hosted Portable Core with local model and storage, no data add-ons.
    maturity: supported-starter
    topology: self-hosted-kubernetes

global:
  # empty = the cluster's default StorageClass (k3s: local-path). The chart omits
  # storageClassName for an empty value.
  storageClass: ""

# TLS: once you front this with an HTTPS ingress, set global.externalScheme: https —
# WebAuthn and OIDC derive their origin from it.

# ── Object storage: in-cluster MinIO, addressed through the S3 API ───────────────
storage:
  provider: s3
  endpoint: "minio:9000"
  region: "us-east-1"

minio:
  enabled: true
  # Must be a free address inside YOUR cluster's service CIDR. 10.43.107.150 is
  # k3s's default range (10.43.0.0/16); kubeadm defaults to 10.96.0.0/12, OpenShift
  # to 172.30.0.0/16 — the API server rejects an address outside the range. Find
  # yours: kubectl cluster-info dump | grep -m1 service-cluster-ip-range
  clusterIP: 10.43.107.150
  auth:
    rootUser: datapond
    rootPassword: ""       # empty ⇒ Helm generates and preserves (templates/secrets.yaml)
  persistence:
    enabled: true
    size: 100Gi

# ── Model path: local Ollama registered into LiteLLM by the post-install job ────
ai:
  provider: ollama
  llmEndpoint: ""
  llmModel: "default"
  egressPolicy: "local-only"
  embedModel: "embed"
  embedDim: 1024

litellm:
  enabled: true
  config:
    model_list: []         # seeded by templates/litellm-ollama-init-job.yaml

ollama:
  enabled: true
  defaultModel: "qwen2.5-coder:7b"
  litellmModelName: "default"
  embedModel: "bge-m3"     # 1024-d — must match ai.embedDim
  embedLitellmName: "embed"
  resources:
    requests: { cpu: 500m, memory: 4Gi }
    limits: { cpu: 4000m, memory: 8Gi }
  persistence:
    enabled: true
    size: 20Gi

vllm:
  enabled: false

# ── Core ─────────────────────────────────────────────────────────────────────────
backend:
  enabled: true
frontend:
  enabled: true
valkey:
  enabled: true
postgres:
  enabled: true
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 1000m, memory: 2Gi }
  persistence:
    enabled: true
    size: 50Gi
    # empty = the cluster's default StorageClass. Unlike minio/valkey, postgres does
    # not inherit global.storageClass — it has its own key, defaulted to "local-path"
    # in base values.yaml, so a k3s-shaped profile must clear it explicitly here too.
    storageClass: ""
  auth:
    database: datapond
    username: datapond
    password: ""           # empty ⇒ Helm generates and preserves

# ── Every add-on explicitly off (unset would mean "preserve if already running") ─
trino:
  enabled: false
spark:
  enabled: false
polaris:
  enabled: false
airflow:
  enabled: false
mlflow:
  enabled: false
risingwave:
  enabled: false
openmetadata:
  enabled: false
jupyter:
  enabled: false

networkPolicy:
  enabled: true
