{{- if include "datapond.addonOn" (dict "root" $ "component" "trino") }}
{{- include "datapond.trinoExtraCatalogs.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.trino.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.trino.name }}
    app.kubernetes.io/name: {{ .Values.trino.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: analytics
spec:
  replicas: {{ .Values.trino.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.trino.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.trino.name }}
        version: {{ .Values.trino.image.tag | quote }}
      {{- if .Values.trino.extraCatalogs }}
      annotations:
        # Trino reads catalog files at startup only; a changed extra catalog restarts it.
        checksum/catalogs: {{ include "datapond.trinoExtraCatalogs.files" . | sha256sum | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.trino.serviceAccountName | default "datapond-trino" }}
      containers:
      - name: trino
        image: "{{ .Values.trino.image.repository }}:{{ .Values.trino.image.tag }}"
        imagePullPolicy: {{ .Values.trino.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        {{- include "datapond.trinoPodEnv" . | nindent 8 }}
        volumeMounts:
        - name: trino-config
          mountPath: /etc/trino
        - name: trino-catalog
          mountPath: /etc/trino/catalog
        {{- if include "datapond.localWarehouse" $ }}
        - name: iceberg-warehouse
          mountPath: /opt/iceberg/warehouse
        {{- end }}
        {{- if .Values.trino.rls.enabled }}
        # RLS Layer 2: file-based access control rules (backend regenerates this CM)
        - name: trino-acl
          mountPath: /etc/trino/acl
        {{- end }}
        resources:
          requests:
            cpu: {{ .Values.trino.resources.requests.cpu }}
            memory: {{ .Values.trino.resources.requests.memory }}
          limits:
            cpu: {{ .Values.trino.resources.limits.cpu }}
            memory: {{ .Values.trino.resources.limits.memory }}
        livenessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: trino-config
        configMap:
          name: trino-config
      # Catalog directory: the chart's catalog files plus the source catalogs the backend
      # projects (trino-source-catalogs.yaml). Trino reads one directory, so both land in
      # it through a projected volume; the Secret is optional so a fresh install starts
      # before any source exists.
      - name: trino-catalog
        projected:
          sources:
          - configMap:
              name: trino-catalog
          - secret:
              name: {{ include "datapond.trinoSourceCatalogsSecret" . }}
              optional: true
      {{- if include "datapond.localWarehouse" $ }}
      - name: iceberg-warehouse
        persistentVolumeClaim:
          claimName: iceberg-warehouse-pvc
      {{- end }}
      {{- if .Values.trino.rls.enabled }}
      - name: trino-acl
        configMap:
          name: {{ .Values.trino.rls.configMapName | default "trino-access-control" }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.trino.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.trino.name }}
spec:
  type: {{ .Values.trino.service.type }}
  ports:
  - port: {{ .Values.trino.service.port }}
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.trino.name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: {{ .Values.namespace }}
data:
  config.properties: |
    coordinator=true
    {{- /* With workers the coordinator only plans; alone it also executes. */}}
    node-scheduler.include-coordinator={{ if gt (int (dig "workers" "replicas" 0 .Values.trino)) 0 }}false{{ else }}true{{ end }}
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    query.max-memory=2GB
    query.max-memory-per-node=1GB
{{- if .Values.trino.rls.enabled }}

  # RLS Layer 2: file-based system access control (row filters + column masks).
  # rules.json lives in the trino-acl ConfigMap; backend regenerates it on policy change.
  access-control.properties: |
    access-control.name=file
    security.config-file=/etc/trino/acl/rules.json
    security.refresh-period={{ .Values.trino.rls.refreshPeriod | default "30s" }}
{{- end }}

  node.properties: |
    node.environment=production
    node.id=trino-node-1
    node.data-dir=/data/trino

  jvm.config: |
    -server
    -Xmx2G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+UseGCOverheadLimit
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
{{- $workers := int (dig "workers" "replicas" 0 .Values.trino) }}
{{- if gt $workers 0 }}
{{- $w := .Values.trino.workers }}
---
# Trino workers (trino.workers.replicas > 0): the same image, catalogs and credentials as
# the coordinator, announcing themselves to it through its Service. Labelled
# app: <trino>-worker so the coordinator Service does not route clients to them. The
# backend restarts them with the coordinator when the source catalogs change
# (TRINO_WORKER_DEPLOYMENT) — workers read catalog files only at startup too.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.trino.name }}-worker
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.trino.name }}-worker
    app.kubernetes.io/name: {{ .Values.trino.name }}-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: analytics
spec:
  replicas: {{ $workers }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.trino.name }}-worker
  template:
    metadata:
      labels:
        app: {{ .Values.trino.name }}-worker
        version: {{ .Values.trino.image.tag | quote }}
      {{- if .Values.trino.extraCatalogs }}
      annotations:
        checksum/catalogs: {{ include "datapond.trinoExtraCatalogs.files" . | sha256sum | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.trino.serviceAccountName | default "datapond-trino" }}
      containers:
      - name: trino
        image: "{{ .Values.trino.image.repository }}:{{ .Values.trino.image.tag }}"
        imagePullPolicy: {{ .Values.trino.image.pullPolicy }}
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        {{- include "datapond.trinoPodEnv" . | nindent 8 }}
        volumeMounts:
        - name: trino-config
          mountPath: /etc/trino
        - name: trino-catalog
          mountPath: /etc/trino/catalog
        {{- if include "datapond.localWarehouse" $ }}
        - name: iceberg-warehouse
          mountPath: /opt/iceberg/warehouse
        {{- end }}
        resources:
          {{- toYaml ($w.resources | default .Values.trino.resources) | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /v1/info
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: trino-config
        configMap:
          name: {{ .Values.trino.name }}-worker-config
      - name: trino-catalog
        projected:
          sources:
          - configMap:
              name: trino-catalog
          - secret:
              name: {{ include "datapond.trinoSourceCatalogsSecret" . }}
              optional: true
      {{- if include "datapond.localWarehouse" $ }}
      - name: iceberg-warehouse
        persistentVolumeClaim:
          claimName: iceberg-warehouse-pvc
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.trino.name }}-worker-config
  namespace: {{ .Values.namespace }}
data:
  config.properties: |
    coordinator=false
    http-server.http.port=8080
    discovery.uri=http://{{ .Values.trino.name }}:{{ .Values.trino.service.port }}
    query.max-memory-per-node={{ $w.maxMemoryPerNode | default "1GB" }}
  node.properties: |
    node.environment=production
    node.id=${ENV:HOSTNAME}
    node.data-dir=/data/trino
  jvm.config: |
    -server
    -Xmx{{ $w.heap | default "2G" }}
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+UseGCOverheadLimit
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
  namespace: {{ .Values.namespace }}
data:
  iceberg.properties: |
    connector.name=iceberg
    {{- if eq ((.Values.catalog | default dict).backend | default "polaris") "glue" }}
    # AWS Glue Data Catalog (the AWS Single-Node Reference). Credentials come from the
    # node instance profile via IMDS — networkpolicy.yaml allows this pod to reach it.
    iceberg.catalog.type=glue
    hive.metastore.glue.region={{ .Values.storage.region | default "us-east-1" }}
    hive.metastore.glue.default-warehouse-dir={{ (.Values.catalog | default dict).glueWarehouse }}
    {{- else if (include "datapond.addonOn" (dict "root" $ "component" "polaris")) }}
    # Polaris REST Catalog (Unity Catalog alternative)
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://{{ .Values.polaris.name }}:{{ .Values.polaris.service.port }}/api/catalog
    # Polaris uses the catalog NAME (not the S3 path) as the warehouse identifier
    iceberg.rest-catalog.warehouse={{ .Values.polaris.catalogName | default "iceberg" }}
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential={{ .Values.polaris.auth.clientId }}:${ENV:POLARIS_CLIENT_SECRET}
    iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
    {{- else if .Values.postgres.enabled }}
    # Fallback: JDBC Catalog (deprecated). With neither polaris nor in-cluster
    # postgres enabled there is no local catalog backend at all.
    iceberg.catalog.type=jdbc
    iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
    iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg_catalog
    iceberg.jdbc-catalog.connection-user={{ .Values.postgres.auth.username }}
    iceberg.jdbc-catalog.connection-password=${ENV:POSTGRES_PASSWORD}
    {{- end }}
    # Lets the catalog export (POST /api/catalogs/{name}/export) register another
    # catalog's existing Iceberg tables here without copying data — the exit path off
    # a provider catalog. Only an admin route calls it.
    iceberg.register-table-procedure.enabled=true
    fs.native-s3.enabled=true
    {{- if .Values.storage.endpoint }}
    s3.endpoint=http://{{ .Values.storage.endpoint }}
    s3.path-style-access=true
    {{- end }}
    s3.region={{ .Values.storage.region | default "us-east-1" }}
  {{- if .Values.postgres.enabled }}

  postgres.properties: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://postgres:5432/datapond
    connection-user={{ .Values.postgres.auth.username }}
    connection-password=${ENV:POSTGRES_PASSWORD}
  {{- end }}
  {{- if .Values.trino.extraCatalogs }}
  {{- include "datapond.trinoExtraCatalogs.files" . | trim | nindent 2 }}
  {{- end }}
{{- end }}
{{- if .Values.trino.rls.enabled }}
---
# RLS Layer 2: file-based access control rules. Seeded with an allow-all/no-tables
# rule; the backend (POST /api/governance/rls/trino-rules/apply) patches data.rules.json
# from rls_policies/column_masking_policies. Trino auto-reloads per security.refresh-period.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.trino.rls.configMapName | default "trino-access-control" }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.trino.name }}
    app.kubernetes.io/component: trino-rls
data:
  rules.json: |
    {"catalogs":[{"allow":"all"}],"schemas":[{"user":".*","schema":".*","owner":false}],"tables":[]}
{{- end }}
