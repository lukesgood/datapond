{{- if include "datapond.addonOn" (dict "root" $ "component" "mlflow") }}
{{- /* The database the way litellm-deployment.yaml resolves it: the external database
       (Aurora) when configured, the in-cluster postgres otherwise. This template used to
       hard-code host `postgres`, which does not exist once externalDatabase is on. */}}
{{- $pgHost := ternary .Values.externalDatabase.host (.Values.postgres.name | default "postgres") .Values.externalDatabase.enabled }}
{{- $pgPort := ternary (.Values.externalDatabase.port | default 5432) (.Values.postgres.service.port | default 5432) .Values.externalDatabase.enabled }}
{{- $sslmode := ternary (.Values.externalDatabase.sslmode | default "require") "disable" .Values.externalDatabase.enabled }}
{{- $db := .Values.mlflow.backend.database | default "mlflow" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mlflow.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.mlflow.name }}
spec:
  replicas: {{ .Values.mlflow.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.mlflow.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.mlflow.name }}
    spec:
      serviceAccountName: {{ .Values.mlflow.serviceAccountName | default "datapond-mlflow" }}
      initContainers:
      # MLflow creates its tables but not its database, and on an external database nothing
      # else does either (postgres-init runs only on a fresh in-cluster PG). Idempotent.
      - name: ensure-mlflow-db
        image: postgres:16.14-alpine
        env:
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_PASSWORD
        - name: PGSSLMODE
          value: {{ $sslmode | quote }}
        command:
          - sh
          - -c
          - |
            until pg_isready -h {{ $pgHost }} -p {{ $pgPort }} -U "$PGUSER"; do
              echo "Waiting for PostgreSQL at {{ $pgHost }}..."
              sleep 2
            done
            psql -h {{ $pgHost }} -p {{ $pgPort }} -U "$PGUSER" -d postgres -tAc \
              "SELECT 1 FROM pg_database WHERE datname='{{ $db }}'" | grep -q 1 || \
              psql -h {{ $pgHost }} -p {{ $pgPort }} -U "$PGUSER" -d postgres \
              -c "CREATE DATABASE {{ $db }}"
            echo "mlflow DB ensured on {{ $pgHost }}."
      containers:
      - name: mlflow
        image: "{{ .Values.mlflow.image.repository }}:{{ .Values.mlflow.image.tag }}"
        ports:
        - containerPort: {{ .Values.mlflow.service.port }}
          name: http
        command:
        - /bin/sh
        - -c
        - |
          pip install --no-cache-dir psycopg2-binary==2.9.9 && \
          exec mlflow server \
            --host 0.0.0.0 \
            --port {{ .Values.mlflow.service.port }} \
            --backend-store-uri "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ $pgHost }}:{{ $pgPort }}/{{ $db }}?sslmode={{ $sslmode }}" \
            --default-artifact-root {{ .Values.mlflow.artifactRoot | default "s3://mlflow-artifacts" | quote }} \
            --static-prefix /mlflow
        env:
        # MLflow serves via gunicorn, which by default only trusts X-Forwarded-*
        # from localhost. Behind the ingress/ALB the proxy IP isn't local, so
        # without this gunicorn ignores X-Forwarded-Proto and emits http redirects
        # (Mixed Content under TLS). "*" trusts the in-cluster ingress hop.
        - name: FORWARDED_ALLOW_IPS
          value: "*"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_PASSWORD
        {{- if .Values.storage.endpoint }}
        - name: MLFLOW_S3_ENDPOINT_URL
          value: "http://{{ .Values.storage.endpoint }}"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: SEAWEEDFS_S3_USER
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: SEAWEEDFS_S3_PASSWORD
        {{- end }}
        resources:
          requests:
            cpu: {{ .Values.mlflow.resources.requests.cpu }}
            memory: {{ .Values.mlflow.resources.requests.memory }}
          limits:
            cpu: {{ .Values.mlflow.resources.limits.cpu }}
            memory: {{ .Values.mlflow.resources.limits.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mlflow.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.mlflow.service.type }}
  ports:
  - port: {{ .Values.mlflow.service.port }}
    targetPort: {{ .Values.mlflow.service.port }}
  selector:
    app: {{ .Values.mlflow.name }}
{{- end }}
