{{- if .Values.backend.enabled }}
# 백엔드 System 정보(/api/system/info) + 서비스 상태 조회용 RBAC.
# 기존 out-of-band Role과 충돌하지 않도록 별도 이름으로 추가(additive)한다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: datapond-backend-reader
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.backend.name }}
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Restarting a service deletes its pod. Pod names are generated, so resourceNames
  # cannot scope this; the endpoint behind it is admin-only.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Scaling, narrowed to the deployments this chart creates. It was namespace-wide,
  # which meant the backend could rewrite any Deployment that happened to share the
  # namespace — including one it did not install. The Services page only ever offers
  # these, so nothing is lost.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - {{ .Values.backend.name }}
      - {{ .Values.frontend.name }}
      - litellm
      - valkey
      - postgres
      - trino
      - polaris
      - mlflow
      - jupyterlab
      - airflow-webserver
      - airflow-scheduler
      - spark-master
      - spark-worker
      - risingwave-meta
      - risingwave-compute
      - risingwave-frontend
      - risingwave-compactor
      - openmetadata-server
      - openmetadata-elasticsearch
    verbs: ["patch", "update"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # RLS Layer 2 writes exactly one ConfigMap: the Trino access-control rules. Write
  # was namespace-wide, so the same credential could have rewritten any ConfigMap in
  # the namespace — every service's configuration. resourceNames does not apply to
  # list/watch, so those stay separate and read-only.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ dig "trinoAclConfigMap" "trino-access-control" (.Values.governance | default dict) | quote }}]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: datapond-backend-reader-binding
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.backend.name }}
subjects:
  # Bind ONLY the SA the backend pod actually runs as (same default as the
  # Deployment's serviceAccountName). Do NOT bind the namespace `default` SA —
  # these escalated verbs (pods/delete, deployments/patch) must not leak to
  # every add-on pod that runs without an explicit SA.
  - kind: ServiceAccount
    name: {{ .Values.backend.serviceAccountName | default "datapond-backend" }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: datapond-backend-reader
  apiGroup: rbac.authorization.k8s.io
---
# Nodes are cluster-scoped, so the System page's node specs (CPU/memory/disk) and
# the real usage-% (used ÷ node allocatable) need a ClusterRole. Read-only get/list.
# Without it, list_node() 403s → specs are blank and memory-% falls back to raw MiB
# (rendered as an absurd "1747%").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.namespace }}-backend-node-reader
  labels:
    app: {{ .Values.backend.name }}
    app.kubernetes.io/component: backend
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}-backend-node-reader-binding
  labels:
    app: {{ .Values.backend.name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.backend.serviceAccountName | default "datapond-backend" }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.namespace }}-backend-node-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
