{{- if and .Values.minio.enabled (include "datapond.addonOn" (dict "root" $ "component" "polaris")) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        # The backend image and boto3, not minio/mc: MinIO no longer publishes mc
        # images anonymously, and this Job needs nothing the backend image lacks.
        - name: bucket-init
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: S3_USER
              valueFrom: { secretKeyRef: { name: datapond-secrets, key: SEAWEEDFS_S3_USER } }
            - name: S3_PASS
              valueFrom: { secretKeyRef: { name: datapond-secrets, key: SEAWEEDFS_S3_PASSWORD } }
            - name: BUCKET
              value: "{{ .Values.polaris.warehouseBucket | default "iceberg" }}"
          command: ["python", "-c"]
          args:
            - |
              import os, time, boto3
              from botocore.exceptions import ClientError, EndpointConnectionError
              s3 = boto3.client("s3", endpoint_url="http://minio:9000", region_name="us-east-1",
                                aws_access_key_id=os.environ["S3_USER"],
                                aws_secret_access_key=os.environ["S3_PASS"])
              bucket = os.environ["BUCKET"]
              for i in range(36):
                  try:
                      s3.list_buckets(); break
                  except (EndpointConnectionError, ClientError) as e:
                      print(f"waiting for minio... ({i + 1}): {e}", flush=True); time.sleep(5)
              else:
                  raise SystemExit("minio did not answer")
              try:
                  s3.create_bucket(Bucket=bucket)
              except ClientError as e:
                  if e.response["Error"]["Code"] not in ("BucketAlreadyOwnedByYou", "BucketAlreadyExists"):
                      raise
              print(f"bucket '{bucket}' ready.")
{{- end }}
