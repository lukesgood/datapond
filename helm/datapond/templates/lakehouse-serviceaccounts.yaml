{{- /* One ServiceAccount per S3-consuming lakehouse service. Annotated with the
       shared IRSA role only when lakehouseIrsa.roleArn is set (EKS); un-annotated
       on K3s ⇒ pods use the node instance profile. SA names MUST match
       terraform var.lakehouse_sa_names. */}}
{{- $svcs := list
  (dict "name" "datapond-backend" "enabled" .Values.backend.enabled)
  (dict "name" "datapond-trino"   "enabled" (include "datapond.addonOn" (dict "root" $ "component" "trino")))
  (dict "name" "datapond-spark"   "enabled" (include "datapond.addonOn" (dict "root" $ "component" "spark")))
  (dict "name" "datapond-jupyter" "enabled" (include "datapond.addonOn" (dict "root" $ "component" "jupyter")))
  (dict "name" "datapond-mlflow"  "enabled" (include "datapond.addonOn" (dict "root" $ "component" "mlflow")))
  (dict "name" "datapond-polaris" "enabled" (include "datapond.addonOn" (dict "root" $ "component" "polaris"))) }}
{{- range $svcs }}
{{- if .enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  {{- with $.Values.lakehouseIrsa.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
