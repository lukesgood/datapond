{{- if .Values.postgres.enabled }}
# Headless service required by StatefulSet for pod identity (postgres-0.postgres-headless)
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}-headless
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.postgres.name }}
spec:
  ports:
  - port: {{ .Values.postgres.service.port }}
    name: postgres
  clusterIP: None
  selector:
    app: {{ .Values.postgres.name }}
---
# Stable ClusterIP service — survives pod restarts and IP changes
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.postgres.name }}
spec:
  ports:
  - port: {{ .Values.postgres.service.port }}
    targetPort: {{ .Values.postgres.service.port }}
    name: postgres
  selector:
    app: {{ .Values.postgres.name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.postgres.name }}
    app.kubernetes.io/name: {{ .Values.postgres.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ .Values.postgres.name }}-headless
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.postgres.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.postgres.name }}
    spec:
      containers:
      - name: postgres
        # pgvector/pgvector is a drop-in postgres image: docker-entrypoint.sh runs as
        # root and steps down the same way valkey's does — `find ... chown postgres`
        # (docker_create_db_directories(), only when `id -u` = 0) needs CHOWN, and
        # `exec gosu postgres ...` (the actual privilege drop; gosu calls
        # setresgid/setgroups/setresuid directly) needs SETUID and SETGID. Both run
        # on every container start, not just first init.
        #
        # The entrypoint also does `chmod 00700 "$PGDATA" || :` and
        # `chmod 03775 /var/run/postgresql || :` — both suffixed `|| :`, so a chmod
        # failing for lack of FOWNER is swallowed, not fatal. A `chmod 700` on a
        # custom WAL dir has no `|| :`, but nothing in this chart sets
        # POSTGRES_INITDB_WALDIR, so that path never runs here. FOWNER/DAC_OVERRIDE
        # are left out on that basis, not because they were tested and found
        # unnecessary — if that assumption changes (a WAL dir override, an image
        # bump that reorders the entrypoint), treat a CrashLoop here as a signal to
        # revisit this list, the same way valkey's SETUID/SETGID/CHOWN were each
        # found one CrashLoop at a time.
        {{- include "datapond.containerSecurity" (dict "enabled" (.Values.podSecurity).enabled "keep" (list "SETUID" "SETGID" "CHOWN")) | nindent 8 }}
        image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
        ports:
        - containerPort: {{ .Values.postgres.service.port }}
          name: postgres
        env:
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: {{ .Values.postgres.resources.requests.cpu }}
            memory: {{ .Values.postgres.resources.requests.memory }}
          limits:
            cpu: {{ .Values.postgres.resources.limits.cpu }}
            memory: {{ .Values.postgres.resources.limits.memory }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U $POSTGRES_USER
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: init-scripts
        configMap:
          name: postgres-init-scripts
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      {{- include "datapond.storageClassName" (dict "value" .Values.postgres.persistence.storageClass "indent" 6) }}
      resources:
        requests:
          storage: {{ .Values.postgres.persistence.size }}
{{- end }}
