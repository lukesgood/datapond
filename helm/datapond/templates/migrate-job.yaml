{{- if and .Values.backend.enabled (.Values.migrations | default dict).enabled }}
{{/*
Schema migrations: one pod, once, before the backend serves anything.

Not in the application's startup hook, which runs in every replica — two backends
starting during a rolling upgrade would both issue DDL, and Alembic does not lock. And
not tied to readiness, so a slow CREATE INDEX cannot hold pods NotReady until
`helm --wait` rolls back a release that was working.

**Not a hook, either.** It was a pre-install one, and that cannot work: the Secret it
reads its credentials from is a main-phase resource (the Job pod sat in
CreateContainerConfigError), and with an in-cluster database there is no database yet
— hooks run before the Postgres the same release creates. Both were found by the
ephemeral install job, one after the other. Moving it to post-install is worse:
readiness records `base_schema` once at startup, so a backend that starts first is not
slow, it is permanently NotReady.

So it is an ordinary manifest resource, and the backend waits for it in an init
container. Nothing leaves the manifest — see templates/namespace.yaml for what that
costs — the migration still runs exactly once, and the application still never
migrates.

The name carries .Release.Revision because a Job's pod template is immutable: without
it the second upgrade fails with `field is immutable` instead of migrating. Old Jobs
clear themselves through ttlSecondsAfterFinished; a failed one is kept, because
deleting the evidence of the thing that stopped a release is how an outage becomes a
mystery.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.backend.name }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.backend.name }}
    app.kubernetes.io/component: migrate
spec:
  # A migration is not a thing to retry blindly: a partial failure retried can leave
  # a worse state than the first attempt. One try, then a human reads the log.
  #
  # Waiting for the database is separate and lives inside the container — the Job now
  # starts alongside Postgres rather than after it, and a closed socket is not a failed
  # migration. See app/migrations.py:should_keep_waiting.
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: {{ .Values.backend.name }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "datapond.podSecurity" (dict "enabled" (.Values.podSecurity).enabled "uid" (.Values.podSecurity).backend.uid "gid" (.Values.podSecurity).backend.gid) | nindent 6 }}
      containers:
      - name: migrate
        {{- include "datapond.containerSecurity" (.Values.podSecurity).enabled | nindent 8 }}
        image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        command: ["python", "-m", "app.migrations"]
        env:
        # The same database the application uses, from the same secret. A second way
        # to say where the database is would be a second way to get it wrong.
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: datapond-secrets
              key: POSTGRES_DB
        - name: POSTGRES_HOST
          value: "{{ if .Values.externalDatabase.enabled }}{{ .Values.externalDatabase.host }}{{ else }}postgres{{ end }}"
        - name: POSTGRES_PORT
          value: "{{ if .Values.externalDatabase.enabled }}{{ .Values.externalDatabase.port | default 5432 }}{{ else }}5432{{ end }}"
        {{- if .Values.externalDatabase.enabled }}
        - name: POSTGRES_SSLMODE
          value: "{{ .Values.externalDatabase.sslmode | default "require" }}"
        {{- end }}
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 512Mi}
{{- end }}
