name: CD

# main 머지(또는 v* 태그) 시 backend/frontend 이미지를 git-SHA로 태깅해 GHCR에 push.
# 'latest' 단일 태그 + 수동 ctr import의 한계(버전 추적·롤백 불가)를 대체한다.
#
# 배포(helm upgrade) 단계는 기본 비활성 — 대상 클러스터 kubeconfig가 필요하므로
# 다음을 설정해야 동작한다:
#   - repo Variable  ENABLE_CD_DEPLOY = "true"
#   - repo Secret    KUBE_CONFIG      = (대상 클러스터 kubeconfig 전체)
# 설정 전까지는 이미지 push까지만 수행되고, 배포는 `helm upgrade --set *.image.tag=<sha>`로 수동.

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/datapond

jobs:
  require-ci:
    name: Require CI green for this commit
    runs-on: ubuntu-latest
    permissions:
      # actions: read is what the query below actually needs — it asks
      # /repos/{repo}/actions/runs, not the Checks API. A job-level permissions block
      # is exhaustive: every scope not named here is `none`, so without this line the
      # first `gh api` call 403s, `set -euo pipefail` ends the step on that failed
      # command substitution before the retry loop, and no push or tag ever publishes
      # an image.
      actions: read
      checks: read
      contents: read
    steps:
      # CI and CD ran independently: a commit whose tests failed still built and
      # pushed images tagged with its SHA, and could be deployed from them. This job
      # asks the Checks API what actually happened to THIS commit and refuses to
      # continue otherwise. Waiting rather than failing immediately, because on a
      # push both workflows start at once.
      - name: Wait for CI, then require success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
                     --jq '[.workflow_runs[] | select(.name == "CI")] | .[0] // empty')
            [ -n "$runs" ] || { echo "no CI run yet (attempt $attempt)"; sleep 20; continue; }
            status=$(echo "$runs" | jq -r .status)
            conclusion=$(echo "$runs" | jq -r .conclusion)
            echo "CI: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              [ "$conclusion" = "success" ] || {
                echo "::error::CI concluded '$conclusion' for ${{ github.sha }} — not building or deploying it."
                exit 1
              }
              exit 0
            fi
            sleep 20
          done
          echo "::error::timed out waiting for CI on ${{ github.sha }}"
          exit 1

  build-and-push:
    name: Build & push images (GHCR)
    needs: require-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute tag (short SHA 또는 git tag)
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(echo "${GITHUB_SHA}" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          fi
          echo "appversion=$(grep '^appVersion:' helm/datapond/Chart.yaml | tr -d ' \"' | cut -d: -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: enterprise
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}-backend:${{ steps.meta.outputs.appversion }}
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_BASE }}-frontend:${{ steps.meta.outputs.appversion }}

  deploy:
    name: Deploy (helm upgrade)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CD_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Helm upgrade (이미지 태그 = ${{ needs.build-and-push.outputs.tag }})
        run: |
          TAG="${{ needs.build-and-push.outputs.tag }}"
          VALUES="${{ vars.HELM_VALUES_FILE || 'helm/datapond/values-onprem.yaml' }}"
          helm upgrade --install datapond helm/datapond \
            --namespace datapond --create-namespace \
            --values "$VALUES" \
            --set backend.image.repository=${{ env.IMAGE_BASE }}-backend \
            --set backend.image.tag="$TAG" \
            --set backend.image.pullPolicy=Always \
            --set frontend.image.repository=${{ env.IMAGE_BASE }}-frontend \
            --set frontend.image.tag="$TAG" \
            --set frontend.image.pullPolicy=Always \
            --atomic --wait --timeout 10m
