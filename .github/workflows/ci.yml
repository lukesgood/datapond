name: CI

# PR·main push 시 머지 게이트 — 단위테스트 + 타입체크 + Helm lint.
# (이번 세션의 DatabaseURLConnector NameError 같은 회귀를 머지 전에 차단)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run unit tests
        working-directory: backend
        # backend/tests = 서비스 비의존 단위테스트. 루트 test_*.py(통합 스크립트)는 제외.
        run: |
          python -m pytest tests -q
          PYTHONPATH=../ee/backend python -m pytest ../ee/backend/tests -q

  frontend-check:
    name: Frontend type check + lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, matching frontend/Dockerfile (node:22.23.1-alpine). CI type-checked on
          # 20 while the image built on 22, so the version that gates a merge was not
          # the version that ships. 22.18+ also runs TypeScript test files directly,
          # which is what lets the parser tests below exist without adding a test
          # framework.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true   # 경고는 차단하지 않음(점진 정리)
      - name: Unit tests
        working-directory: frontend
        run: npm test

  license-gate:
    name: License gate (direct deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python direct-deps license check
        working-directory: backend
        run: |
          pip install -q -r requirements.txt pip-licenses
          # Direct deps only: names from requirements.txt (strip extras/pins/comments)
          PKGS=$(sed -E 's/\[[^]]*\]//; s/[<>=!~;].*$//' requirements.txt | tr -d ' ' | grep -v '^#' | grep -v '^$' | tr '\n' ' ')
          pip-licenses --format=csv --packages $PKGS | tee /tmp/pylic.csv
          # Denylist (UNKNOWN fails closed); allowlisted packages (.license-allowlist.txt) are accepted-by-review
          viol=$(tail -n +2 /tmp/pylic.csv | awk -F'","' '{ lic=toupper($3); gsub(/"/,"",lic); if (lic ~ /GPL|AGPL|SSPL|ELASTIC|BSL|COMMONS CLAUSE|EPL|MPL|CDDL|UNKNOWN/) print }' | grep -vFf ../.license-allowlist.txt || true)
          if [ -n "$viol" ]; then echo "::error::Disallowed dependency licenses:"; echo "$viol"; exit 1; fi
          echo "OK: python direct deps clean"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # same runtime as the image and the other jobs
      - name: npm production-deps license check
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx --yes license-checker --production --csv | tee /tmp/jslic.csv
          # NOTE: npm side scans production-TRANSITIVE deps (license-checker walks the tree); python side is direct-deps-only (--packages). Full transitive/image SBOM coverage is deferred to P0-4.
          viol=$(tail -n +2 /tmp/jslic.csv | awk -F'","' '{ lic=toupper($2); gsub(/"/,"",lic); if (lic ~ /GPL|AGPL|SSPL|ELASTIC|BSL|COMMONS CLAUSE|EPL|MPL|CDDL|UNKNOWN/) print }' | grep -vFf ../.license-allowlist.txt || true)
          if [ -n "$viol" ]; then echo "::error::Disallowed dependency licenses:"; echo "$viol"; exit 1; fi
          echo "OK: npm production deps clean"

  security-scan:
    name: Trivy filesystem scan (dependency vulns / SBOM)
    runs-on: ubuntu-latest
    # A real merge gate as of 2026-08-25. It was report-only, with a note saying to
    # flip it "once the baseline is clean" — and the baseline had grown to 41
    # HIGH/CRITICAL findings, among them an algorithm-confusion bug in the JWT
    # library this product authenticates with and a SQL injection in a database
    # driver it ships. A scan nobody has to act on records vulnerabilities; it does
    # not prevent them.
    #
    # The baseline is now zero. If this job fails, the fix is to raise the pinned
    # version, not to lower this back to 0.
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scan (fs mode — no image build required)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          # Both dependency files are picked up automatically by fs-mode's
          # lockfile detection (backend/requirements.txt, frontend/package-lock.json).

  acceptance:
    name: Portable Core acceptance (deployed target)
    runs-on: ubuntu-latest
    # Pointed at the live reference deployment. The suite writes: it creates a
    # collection under a per-run name, ingests a few hundred bytes, and removes them
    # however the run ends. It also spends a small amount on embeddings each run,
    # which is the price of knowing the path still works.
    #
    # ACCEPTANCE_TOKEN is a service-account key, not a session JWT. A JWT in a CI
    # secret expires and turns into a mystery failure weeks later; a service account
    # is the credential built for a non-human caller and can be revoked on its own
    # without touching a person's account. It holds ai_engineer — enough for
    # knowledge:write and ai:generate, and nothing administrative.
    #
    # ACCEPTANCE_VIEWER_TOKEN is optional and adds the read-only boundary check.
    if: ${{ vars.ACCEPTANCE_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest httpx
      # The reference deployment is stopped outside weekday hours to save money. An
      # unreachable target is not a failed acceptance, and failing the run for it
      # would block merges at night for a reason unrelated to the change. It is
      # announced rather than passed over quietly, so nobody reads a green tick as
      # "acceptance ran".
      - name: Is the target up
        id: probe
        env:
          BASE: ${{ vars.ACCEPTANCE_BASE_URL }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/api/health/ready" || echo 000)
          if [ "$code" = "200" ]; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Acceptance not run::$BASE did not answer (HTTP $code). The deployment is likely stopped; acceptance did NOT run for this commit."
          fi
      - name: Acceptance
        if: steps.probe.outputs.up == 'true'
        working-directory: backend
        env:
          DATAPOND_BASE_URL: ${{ vars.ACCEPTANCE_BASE_URL }}
          DATAPOND_TOKEN: ${{ secrets.ACCEPTANCE_TOKEN }}
          DATAPOND_VIEWER_TOKEN: ${{ secrets.ACCEPTANCE_VIEWER_TOKEN }}
        run: pytest tests/acceptance -v

  fresh-install:
    name: Fresh install, upgrade and rollback (ephemeral cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The live acceptance proves the path works on a deployment that has been running
    # for weeks and repaired by hand along the way. It cannot prove that someone
    # installing today gets a working system, and it cannot test upgrade or rollback
    # without doing that to production.
    #
    # So: an empty cluster, the chart installed from nothing, the model replaced by a
    # deterministic stand-in (backend/app/testing/mock_model.py) because a cluster
    # like this has no Bedrock credentials and should not need any.
    steps:
      - uses: actions/checkout@v4

      - name: Create a cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: datapond
          wait: 120s

      - name: Build the backend image
        run: |
          docker build -f backend/Dockerfile --target enterprise -t datapond-backend:ci .
          kind load docker-image datapond-backend:ci --name datapond

      - name: Build the frontend image
        run: |
          docker build -f frontend/Dockerfile -t datapond-frontend:ci frontend
          kind load docker-image datapond-frontend:ci --name datapond

      - name: Install from nothing
        run: |
          helm install datapond helm/datapond \
            --namespace datapond --create-namespace \
            -f helm/datapond/values-ephemeral.yaml \
            --set-string backend.image.repository=datapond-backend \
            --set-string backend.image.tag=ci \
            --set backend.image.pullPolicy=Never \
            --set-string frontend.image.repository=datapond-frontend \
            --set-string frontend.image.tag=ci \
            --set frontend.image.pullPolicy=Never \
            --wait --timeout 12m

      - name: The schema came from migrations, not from bootstraps
        run: |
          kubectl -n datapond exec deploy/backend -- python -c "
          import asyncio, json, urllib.request
          d = json.load(urllib.request.urlopen('http://localhost:8000/health/ready', timeout=10))
          print(json.dumps(d, indent=1))
          assert d['ready'] is True, d
          assert d['state'].get('migrations', '').startswith('at '), d['state']
          assert d['state'].get('base_schema') == 'core tables present', d['state']
          "

      - name: Acceptance against the fresh install
        run: |
          pip install pytest httpx
          kubectl -n datapond port-forward svc/backend 8000:8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health/ready >/dev/null && break; sleep 2; done
          TOKEN=$(kubectl -n datapond exec deploy/backend -- python -c "
          import asyncio
          from app.api.auth import _create_token, _get_pool
          async def m():
              p = await _get_pool()
              async with p.acquire() as c:
                  r = await c.fetchrow(\"SELECT id,username,role FROM users WHERE role='admin' LIMIT 1\")
              print(_create_token(str(r['id']), r['username'], r['role']))
          asyncio.run(m())" | tail -1)
          cd backend && DATAPOND_BASE_URL=http://localhost:8000 DATAPOND_TOKEN="$TOKEN" \
            pytest tests/acceptance -v

      - name: Turn an add-on on, without scheduling a pod for it
        # helm template never executes `lookup` (no cluster offline), so the branch
        # that preserves an add-on across an upgrade -- and the branch that removes
        # one on request -- have never run before this job. mlflow is the cheapest
        # add-on to stand up: templates/mlflow-deployment.yaml renders exactly one
        # Deployment and one Service, no PVC, no ConfigMap, no initContainer. Its
        # replica count is a plain value (`.Values.mlflow.replicas`), so it can be
        # set to 0 straight from the command line -- the object exists for `lookup`
        # to find, and nothing is scheduled on a runner that is already tight on
        # pod capacity (see values-ephemeral.yaml's replica-count comment).
        run: |
          helm upgrade datapond helm/datapond \
            --namespace datapond \
            -f helm/datapond/values-ephemeral.yaml \
            --set-string backend.image.repository=datapond-backend \
            --set-string backend.image.tag=ci \
            --set backend.image.pullPolicy=Never \
            --set-string frontend.image.repository=datapond-frontend \
            --set-string frontend.image.tag=ci \
            --set frontend.image.pullPolicy=Never \
            --set mlflow.enabled=true \
            --set mlflow.replicas=0 \
            --wait --timeout 5m
          echo "== mlflow Deployment must exist now, with replicas=0 =="
          REPLICAS=$(kubectl -n datapond get deployment mlflow -o jsonpath='{.spec.replicas}' 2>&1) \
            || { echo "FAIL: mlflow Deployment was not created by --set mlflow.enabled=true"; exit 1; }
          echo "found mlflow Deployment, spec.replicas=$REPLICAS"
          [ "$REPLICAS" = "0" ] || { echo "FAIL: expected replicas=0, got $REPLICAS"; exit 1; }

      - name: Preserve it across an upgrade that does not mention it
        # values-ephemeral.yaml states mlflow.enabled: false explicitly (every
        # add-on stays off in this profile), so a plain re-apply of that file would
        # turn mlflow off deliberately -- not the case this job needs to cover.
        # `--set mlflow.enabled=null` is applied after -f in Helm's merge order, so
        # it overrides that explicit false back to unset -- the same "nobody chose"
        # state a real operator's upgrade would be in if they never touched mlflow.
        # Confirmed locally that this override lands as YAML null, not the string
        # "null": `helm template ... --set mlflow.enabled=null` renders
        # `.Values.mlflow.enabled` as `null`, same as never setting it at all.
        #
        # `helm upgrade` without `--reuse-values` recomputes every value from this
        # invocation's own `-f`/`--set` plus chart defaults -- it does NOT carry
        # forward `--set mlflow.replicas=0` from the previous step. Chart default is
        # `replicas: 1` (values.yaml) and values-ephemeral.yaml never overrides it,
        # so omitting `--set mlflow.replicas=0` here would schedule a real mlflow
        # pod (500m CPU / 1Gi, image not preloaded via `kind load`) on exactly the
        # step whose point is that nothing gets scheduled. Repeating it explicitly.
        run: |
          helm upgrade datapond helm/datapond \
            --namespace datapond \
            -f helm/datapond/values-ephemeral.yaml \
            --set-string backend.image.repository=datapond-backend \
            --set-string backend.image.tag=ci \
            --set backend.image.pullPolicy=Never \
            --set-string frontend.image.repository=datapond-frontend \
            --set-string frontend.image.tag=ci \
            --set frontend.image.pullPolicy=Never \
            --set mlflow.enabled=null \
            --set mlflow.replicas=0 \
            --wait --timeout 5m | tee /tmp/mlflow-preserve-upgrade.notes
          echo "== mlflow Deployment must still exist -- the upgrade never said true or false =="
          if kubectl -n datapond get deployment mlflow >/dev/null 2>&1; then
            echo "PASS: mlflow Deployment survived an upgrade that left the flag unset"
          else
            echo "FAIL: mlflow Deployment was removed by an upgrade that only omitted the flag -- the preserve branch (lookup finds the running Deployment) is broken"
            exit 1
          fi
          echo "== NOTES.txt from that upgrade must tell the operator mlflow was preserved =="
          if grep -q -- "- mlflow: ON, preserved" /tmp/mlflow-preserve-upgrade.notes; then
            echo "PASS: NOTES.txt reported mlflow as preserved"
          else
            echo "FAIL: NOTES.txt did not report mlflow as preserved -- printed output was:"
            cat /tmp/mlflow-preserve-upgrade.notes
            exit 1
          fi

      - name: Turning it off explicitly must still remove it
        # Preservation that cannot be switched off is a leak, not a courtesy: this
        # is the direction that matters more than the one above. `--set
        # mlflow.replicas=0` is not load-bearing here (enabled=false stops the
        # template from rendering the Deployment at all, so no replica count
        # applies), but it is kept for the same reason the previous step needs it:
        # never rely on a `--set` from a prior `helm upgrade` surviving into this one.
        run: |
          helm upgrade datapond helm/datapond \
            --namespace datapond \
            -f helm/datapond/values-ephemeral.yaml \
            --set-string backend.image.repository=datapond-backend \
            --set-string backend.image.tag=ci \
            --set backend.image.pullPolicy=Never \
            --set-string frontend.image.repository=datapond-frontend \
            --set-string frontend.image.tag=ci \
            --set frontend.image.pullPolicy=Never \
            --set mlflow.enabled=false \
            --set mlflow.replicas=0 \
            --wait --timeout 5m
          echo "== mlflow Deployment must be gone -- enabled=false was explicit this time =="
          if kubectl -n datapond get deployment mlflow >/dev/null 2>&1; then
            echo "FAIL: mlflow Deployment still exists after --set mlflow.enabled=false -- preservation cannot be turned off"
            exit 1
          else
            echo "PASS: mlflow Deployment removed by an explicit --set mlflow.enabled=false"
          fi

      - name: Upgrade, then roll back
        run: |
          # A second release with a visible difference, so the rollback has something
          # to undo. The migration Job runs again on the upgrade; the schema is at the
          # same revision, which is what a no-op upgrade should look like.
          #
          # The difference must not be a replica count. A rolling update already needs
          # one pod more than the release runs, and raising the count on top of that is
          # a surge this node cannot schedule — see
          # backend/tests/test_helm_ephemeral_sizing.py.
          helm upgrade datapond helm/datapond \
            --namespace datapond \
            -f helm/datapond/values-ephemeral.yaml \
            --set-string backend.image.repository=datapond-backend \
            --set-string backend.image.tag=ci \
            --set backend.image.pullPolicy=Never \
            --set-string frontend.image.repository=datapond-frontend \
            --set-string frontend.image.tag=ci \
            --set frontend.image.pullPolicy=Never \
            --set backend.systemEvents.tickSeconds=60 \
            --atomic --wait --timeout 12m
          helm -n datapond history datapond
          helm -n datapond rollback datapond 1 --wait --timeout 10m
          kubectl -n datapond rollout status deploy/backend --timeout=5m

      - name: Still working after the rollback
        run: |
          kubectl -n datapond port-forward svc/backend 8001:8000 &
          for i in $(seq 1 30); do curl -sf localhost:8001/health/ready >/dev/null && break; sleep 2; done
          curl -sf localhost:8001/health/ready | tee /dev/stderr | grep -q '"ready": *true'

      - name: What went wrong
        if: failure()
        run: |
          kubectl -n datapond get deployments,statefulsets -o wide || true
          kubectl -n datapond get pods -o wide || true
          kubectl -n datapond describe pods || true
          kubectl -n datapond logs -l app=backend --tail=100 || true
          kubectl -n datapond logs -l app.kubernetes.io/component=migrate --tail=50 || true

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart (quicktest profile = 게이트)
        run: helm lint helm/datapond --values helm/datapond/values-quicktest.yaml
      - name: Template render (모든 프로파일 — 구문 검증)
        run: |
          for v in values-quicktest values-onprem values-aws values-dev values-prod values-foundation values-prod-single; do
            f="helm/datapond/$v.yaml"
            [ -f "$f" ] && { echo "== render $v =="; helm template datapond helm/datapond --values "$f" >/dev/null; }
          done
      - name: FEATURE flags reflect component toggles
        run: |
          echo "== values-foundation (trino disabled) must render FEATURE_TRINO false =="
          helm template datapond helm/datapond --values helm/datapond/values-foundation.yaml \
            | grep -A1 'name: FEATURE_TRINO' | grep -q 'value: "false"' \
            || { echo "FAIL: FEATURE_TRINO should be false in values-foundation"; exit 1; }
          echo "== base values (trino enabled) must render FEATURE_TRINO true =="
          helm template datapond helm/datapond \
            | grep -A1 'name: FEATURE_TRINO' | grep -q 'value: "true"' \
            || { echo "FAIL: FEATURE_TRINO should be true in base values"; exit 1; }
          echo "OK: FEATURE flag gating verified"
      - name: Critical secrets generated + injected
        run: |
          echo "== critical secrets generated + injected =="
          helm template datapond helm/datapond | grep -q 'ENCRYPTION_KEY:' || { echo FAIL ENCRYPTION_KEY; exit 1; }
          helm template datapond helm/datapond | grep -q 'ADMIN_PASSWORD:'  || { echo FAIL ADMIN_PASSWORD; exit 1; }
          helm template datapond helm/datapond | grep -q 'name: ENCRYPTION_KEY' || { echo FAIL ENCRYPTION_KEY inject; exit 1; }
          helm template datapond helm/datapond | grep -q 'name: ADMIN_PASSWORD' || { echo FAIL ADMIN_PASSWORD inject; exit 1; }
          echo "== no duplicate ENCRYPTION_KEY env (stale backend.env would shadow the injection) =="
          for v in "" "--values helm/datapond/values-quicktest.yaml" "--values helm/datapond/values-onprem.yaml"; do
            n=$(helm template datapond helm/datapond $v | grep -c 'name: ENCRYPTION_KEY')
            [ "$n" -eq 1 ] || { echo "FAIL: ENCRYPTION_KEY env appears $n times (profile: ${v:-base})"; exit 1; }
          done
          echo "OK: secrets wired"
          echo "== component credentials generated (P0-1b, onprem render) =="
          # NOTE: here-strings (grep <<<"$VAR"), NOT echo "$VAR" | grep — same SIGPIPE
          # hazard as the P0-4 image-tag checks below; reproduced locally on a large render.
          out=$(helm template datapond helm/datapond --values helm/datapond/values-onprem.yaml)
          for k in POSTGRES_PASSWORD S3_SECRET_KEY AIRFLOW_PASSWORD JUPYTER_TOKEN POLARIS_CLIENT_SECRET; do
            grep -q "$k:" <<<"$out" || { echo "FAIL $k not generated"; exit 1; }
          done
          grep -q 'token="${JUPYTER_TOKEN}"' <<<"$out" || { echo "FAIL jupyter token still hardcoded"; exit 1; }
          echo "== no weak literals in rendered manifests (base/prod/onprem/foundation) =="
          for v in "" "--values helm/datapond/values-prod.yaml" "--values helm/datapond/values-onprem.yaml" "--values helm/datapond/values-foundation.yaml"; do
            r=$(helm template datapond helm/datapond $v)
            if grep -E 'CHANGE_THIS|changeme|datapond_password|datapond_s3_password' <<<"$r"; then
              echo "FAIL: weak credential literal rendered (profile: ${v:-base})"; exit 1
            fi
            if grep -q 'AIRFLOW_PASSWORD: "airflow"' <<<"$r"; then
              echo "FAIL: weak airflow password rendered (profile: ${v:-base})"; exit 1
            fi
          done
          echo "OK: component credentials wired"
          echo "== OIDC env wiring (enterprise SSO) =="
          r=$(helm template datapond helm/datapond \
            --set auth.oidc.enabled=true --set auth.oidc.issuer=https://idp.example \
            --set auth.oidc.clientId=cid --set auth.oidc.clientSecret=csecret)
          grep -q 'name: OIDC_CLIENT_SECRET' <<<"$r" || { echo "FAIL OIDC secretKeyRef"; exit 1; }
          grep -q 'OIDC_CLIENT_SECRET: "csecret"' <<<"$r" || { echo "FAIL OIDC secret entry"; exit 1; }
          grep -q 'name: OIDC_ISSUER' <<<"$r" || { echo "FAIL OIDC env"; exit 1; }
          # Match only DataPond's OIDC envs/secret — not Polaris's unrelated
          # QUARKUS_OIDC_TENANT_ENABLED (which renders unconditionally in the base profile).
          if helm template datapond helm/datapond | grep -qE 'name: OIDC_|OIDC_CLIENT_SECRET:'; then
            echo "FAIL: OIDC leaks into default render"; exit 1
          fi
          echo "OK: OIDC wired"
          echo "== no moving image tags (P0-4) =="
          # NOTE: use here-strings (grep <<<"$VAR"), NOT echo "$VAR" | grep — see the
          # lakehouse-IRSA SIGPIPE note further down for why `echo | grep -q` false-fails
          # under `bash -eo pipefail` on a large render.
          MOVING='(:latest|:main-latest|:main|:stable|:edge|:nightly)$'
          # Family/rolling tags: a version tag with no patch component, e.g. "pg16",
          # "16-alpine", "20-alpine" — these track upstream's rolling family branch and
          # drift unpinned even though they look versioned. A concrete pin either has a "."
          # (16.14-alpine, 0.8.4-pg16, v1.91.0, 3.11.15-slim, 1.36.1, RELEASE.2025-...) or is
          # a documented bare-version exception below. Tags with a "." are never flagged here.
          FAMILY_RE='^[a-z]*[0-9]+(-[a-z0-9]+)?$'
          # Bare (dot-less) tags that ARE already fully concrete, allowlisted per-image and
          # cross-checked against docs/superpowers/plans/p0-4-pinned-versions.md:
          #   482 -> trinodb/trino uses monotonic integer release numbers (no semver patch to omit)
          FAMILY_ALLOWLIST='^(482)$'
          is_family_tag() {
            # $1 = bare tag (no image name/repo, no leading colon)
            case "$1" in
              *.*) return 1 ;;  # has a dot -> treated as a concrete pin
            esac
            grep -qE "$FAMILY_RE" <<<"$1" && ! grep -qE "$FAMILY_ALLOWLIST" <<<"$1"
          }
          for v in "" "--values helm/datapond/values-prod.yaml" "--values helm/datapond/values-onprem.yaml" \
                   "--values helm/datapond/values-quicktest.yaml" "--values helm/datapond/values-foundation.yaml" \
                   "--values helm/datapond/values-aws.yaml"; do
            imgs=$(helm template datapond helm/datapond $v | grep -E '^\s*image:' | sed -E 's/.*image:\s*"?([^"]+)"?.*/\1/' || true)
            if grep -qE "$MOVING" <<<"$imgs"; then
              echo "FAIL: moving image tag in profile ${v:-base}:"; grep -E "$MOVING" <<<"$imgs"; exit 1
            fi
            if grep -qvE ':' <<<"$imgs"; then
              echo "FAIL: untagged image in profile ${v:-base}:"; grep -vE ':' <<<"$imgs"; exit 1
            fi
            while IFS= read -r img; do
              [ -z "$img" ] && continue
              tag="${img##*:}"
              if is_family_tag "$tag"; then
                echo "FAIL: family/rolling image tag (no patch version) in profile ${v:-base}: $img"; exit 1
              fi
            done <<<"$imgs"
          done
          echo "== no moving Docker base images =="
          bimgs=$(grep -hE '^FROM ' backend/Dockerfile frontend/Dockerfile docker/jupyter/Dockerfile \
            | sed -E 's/[[:space:]]+[Aa][Ss][[:space:]]+[A-Za-z0-9_.-]+[[:space:]]*$//' \
            | awk '{print $2}' | grep -E '[:/]' || true)
          if grep -qE "$MOVING|:3.11-slim$|:20-alpine$" <<<"$bimgs"; then
            echo "FAIL: moving Docker base image:"; grep -E "$MOVING|:3.11-slim$|:20-alpine$" <<<"$bimgs"; exit 1
          fi
          if grep -qvE ':' <<<"$bimgs"; then
            echo "FAIL: untagged Docker base image:"; grep -vE ':' <<<"$bimgs"; exit 1
          fi
          while IFS= read -r bimg; do
            [ -z "$bimg" ] && continue
            tag="${bimg##*:}"
            if is_family_tag "$tag"; then
              echo "FAIL: family/rolling Docker base image tag (no patch version): $bimg"; exit 1
            fi
          done <<<"$bimgs"
          echo "OK: no moving image tags"
          echo "== lakehouse IRSA ServiceAccounts =="
          # NOTE: use here-strings (grep -q PATTERN <<<"$VAR"), NOT echo "$VAR" | grep -q.
          # Under `bash -eo pipefail` (GH Actions default) grep -q closes stdin early on a
          # large render → echo gets SIGPIPE(141) → pipefail reports 141 → false failures.
          # default render (no roleArn): 6 SAs exist, NO IRSA annotation leaks
          d=$(helm template datapond helm/datapond --values helm/datapond/values-onprem.yaml)
          for sa in datapond-backend datapond-trino datapond-spark datapond-jupyter datapond-mlflow datapond-polaris; do
            grep -q "name: $sa" <<<"$d" || { echo "FAIL: SA $sa missing (onprem render)"; exit 1; }
          done
          if grep -q 'eks.amazonaws.com/role-arn' <<<"$d"; then
            echo "FAIL: IRSA annotation leaked into a no-roleArn render"; exit 1
          fi
          # with roleArn set: annotation renders on the SAs
          a=$(helm template datapond helm/datapond --values helm/datapond/values-onprem.yaml --set lakehouseIrsa.roleArn=arn:aws:iam::123456789012:role/datapond-lakehouse-s3)
          grep -q 'eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/datapond-lakehouse-s3"' <<<"$a" || { echo "FAIL: IRSA annotation not rendered when roleArn set"; exit 1; }
          grep -q 'serviceAccountName: datapond-backend' <<<"$a" || { echo "FAIL: backend serviceAccountName not set"; exit 1; }
          echo "OK: lakehouse IRSA wired"

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: validate (main)
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
      - name: validate (bootstrap)
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate
