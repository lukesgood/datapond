# Alembic, retrofitted onto a schema that already exists. See app/migrations.py for
# why the first revision is a stamp and not a create.
[alembic]
script_location = migrations
# Alembic loads every .py in versions/ as a revision. A stray file there — an editor
# backup, a macOS AppleDouble copy that arrives with a tarball — is parsed as Python
# and takes the whole migration down with a syntax error, which is how an hour went
# into "source code string cannot contain null bytes". Only files matching the
# revision naming are considered.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
# The URL is supplied at runtime from the same settings the application uses; leaving
# it here would be a second place for a database address to be wrong.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
